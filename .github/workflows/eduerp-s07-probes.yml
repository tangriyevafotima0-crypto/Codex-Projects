name: S07 focused semantic probes (not approval)
on:
  push:
    branches: ['codex/s07-i-runtime-review']
    paths: ['.github/workflows/eduerp-s07-probes.yml', 's07-semantic-probes.cjs']
permissions:
  contents: read
  actions: write
jobs:
  semantic-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: eduerp-v2
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduerp_probe_admin
          POSTGRES_PASSWORD: TEST_ONLY_PROBE_PASSWORD
          POSTGRES_DB: eduerp_test_probe_admin
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U eduerp_probe_admin -d eduerp_test_probe_admin"
          --health-interval=3s --health-timeout=3s --health-retries=15
    env:
      EDUERP_ALLOW_DESTRUCTIVE_DB_TESTS: 'true'
      TEST_DATABASE_ADMIN_URL: postgresql://eduerp_probe_admin:TEST_ONLY_PROBE_PASSWORD@127.0.0.1:5432/eduerp_test_probe_admin
    steps:
      - name: Stop only the superseded stuck manager-owned diagnostic run
        working-directory: /tmp
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_sha=$(gh api repos/tangriyevafotima0-crypto/Codex-Projects/actions/runs/41840669344 --jq '.head_sha')
          previous_status=$(gh api repos/tangriyevafotima0-crypto/Codex-Projects/actions/runs/41840669344 --jq '.status')
          if [ "$previous_sha" = "6ff48e3fae0cbeacf92f6ab410ea4e394938ec46" ] && [ "$previous_status" != "completed" ]; then
            gh api -X POST repos/tangriyevafotima0-crypto/Codex-Projects/actions/runs/41840669344/cancel
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: eduerp-v2/.nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prisma:generate && npm run build
      - run: node ../s07-semantic-probes.cjs
