name: EduERP H manager diagnostic (not approval)
on:
  push:
    branches: ['codex/s04s06-h-runtime-review']
permissions:
  contents: read
jobs:
  database-auth-students:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eduerp-v2
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduerp_probe_admin
          POSTGRES_PASSWORD: TEST_ONLY_PROBE_PASSWORD
          POSTGRES_DB: eduerp_test_probe_admin
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U eduerp_probe_admin -d eduerp_test_probe_admin"
          --health-interval=3s --health-timeout=3s --health-retries=15
    env:
      EDUERP_ALLOW_DESTRUCTIVE_DB_TESTS: 'true'
      TEST_DATABASE_ADMIN_URL: postgresql://eduerp_probe_admin:TEST_ONLY_PROBE_PASSWORD@127.0.0.1:5432/eduerp_test_probe_admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: eduerp-v2/.nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run lint && npm run typecheck && npm test
      - name: G1 DB suite
        continue-on-error: true
        run: timeout 120s npm run test:db
      - name: G2 Auth suite
        continue-on-error: true
        run: timeout 120s npm run test:auth
      - name: G3 Students suite
        continue-on-error: true
        run: timeout 120s npm run test:students
      - name: Previous credential replay and bad-password regression probe
        run: timeout 90s node ../g-security-probes.cjs
  docker-original-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eduerp-v2
    steps:
      - uses: actions/checkout@v4
      - name: Real candidate Docker stack
        run: docker compose --env-file .env.example -f infra/compose.dev.yml up --build --wait --wait-timeout 150 -d
      - name: Liveness and readiness
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/v1/health
          curl --fail --silent http://127.0.0.1:3000/api/v1/ready
      - name: Failure diagnostics
        if: failure()
        run: docker compose --env-file .env.example -f infra/compose.dev.yml logs --no-color --tail 60
      - name: Cleanup ephemeral dev stack
        if: always()
        run: docker compose --env-file .env.example -f infra/compose.dev.yml down -v
