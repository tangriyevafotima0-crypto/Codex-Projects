name: EduERP S04 manager diagnostic (not approval)
on:
  push:
    branches: ['codex/s04-review-probes']
permissions:
  contents: read
jobs:
  original-runtime-probes:
    timeout-minutes: 6
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eduerp-v2
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduerp_probe_admin
          POSTGRES_PASSWORD: TEST_ONLY_PROBE_PASSWORD
          POSTGRES_DB: eduerp_test_probe_admin
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U eduerp_probe_admin -d eduerp_test_probe_admin"
          --health-interval=3s --health-timeout=3s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: eduerp-v2/.nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prisma original schema validation (expected diagnostic result)
        continue-on-error: true
        run: npm run prisma:generate
      - name: Original compile (errors retained, emitted JS only used for additional diagnostics)
        continue-on-error: true
        run: npm run build
      - name: Original migration and domain probes without masking first failure
        env:
          EDUERP_ALLOW_DESTRUCTIVE_DB_TESTS: 'true'
          TEST_DATABASE_ADMIN_URL: postgresql://eduerp_probe_admin:TEST_ONLY_PROBE_PASSWORD@127.0.0.1:5432/eduerp_test_probe_admin
        continue-on-error: true
        run: npm --workspace=@eduerp/api run test:db
      - name: Additional diagnostic ONLY - bypass known migration file resolution error
        env:
          EDUERP_ALLOW_DESTRUCTIVE_DB_TESTS: 'true'
          TEST_DATABASE_ADMIN_URL: postgresql://eduerp_probe_admin:TEST_ONLY_PROBE_PASSWORD@127.0.0.1:5432/eduerp_test_probe_admin
        continue-on-error: true
        run: |
          mkdir -p apps/api/dist/prisma
          cp -R apps/api/prisma/migrations apps/api/dist/prisma/migrations
          npm --workspace=@eduerp/api run test:db
      - name: Additional live probes for concurrency, object lineage and idempotency scopes
        env:
          EDUERP_ALLOW_DESTRUCTIVE_DB_TESTS: 'true'
          TEST_DATABASE_ADMIN_URL: postgresql://eduerp_probe_admin:TEST_ONLY_PROBE_PASSWORD@127.0.0.1:5432/eduerp_test_probe_admin
        run: node ../s04-extra-probes.cjs
