# EduERP v2.0 — GitHub Actions CI Workflow Template (infra/ci/eduerp-ci.yml)
# Stages 04–05 (04.04, 04.05, 05.04, 05.05 / T04.04, T04.05, T05.04, T05.05):
# - Verifies S01/S02 contracts and S04/S05 schema/migration/role/RBAC invariants + secret scan.
# - Runs Prisma 7 generate, ESLint 9, TypeScript 5.9 strict typecheck, workspace build, and unit/bootstrap tests.
# - Provisions PostgreSQL 16 service container, verifies real Prisma migrate deploy idempotency (`eduerp_migrator`),
#   applies least-privilege DB roles (`02-apply-runtime-grants.sql`), and runs blocking Gate G1 (`npm run test:db`)
#   and blocking Gate G2 (`npm run test:auth`) with zero diagnostic bypasses.
# - Smoke-tests the Docker Compose dev stack (`migrator` + `/api/v1/health` + `/api/v1/ready`).

name: eduerp-v2-ci

on:
  push:
    branches:
      - main
      - "codex/**"
      - "argon/**"
    paths:
      - "eduerp-v2/**"
      - ".github/workflows/eduerp-ci.yml"
  pull_request:
    paths:
      - "eduerp-v2/**"
      - ".github/workflows/eduerp-ci.yml"

defaults:
  run:
    working-directory: eduerp-v2

permissions:
  contents: read

jobs:
  verify-contracts-and-secrets:
    name: "S01/S02/S04/S05 Contract Verification & Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and run S01/S02 and S04/S05 contract & schema verifiers
        run: |
          python3 -m py_compile tools/verify_s01_s02.py tools/verify_s04.py
          python3 tools/verify_s01_s02.py
          python3 tools/verify_s04.py

      - name: Scan tracked files for forbidden secret files and real token patterns
        run: |
          python3 - << 'PY'
          import pathlib, re, subprocess, sys

          root = pathlib.Path(".").resolve()
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()

          forbidden_names = {".env", ".env.local", ".env.production"}
          secret_patterns = [
              ("PRIVATE_KEY_BLOCK", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |PRIVATE )?KEY-----")),
              ("GITHUB_PAT", re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{36,}\b")),
              ("AWS_ACCESS_KEY", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("TELEGRAM_BOT_TOKEN", re.compile(r"\b[0-9]{8,10}:AA[A-Za-z0-9_-]{33}\b")),
          ]

          for rel in tracked:
              p = root / rel
              if p.name in forbidden_names:
                  print(f"FAIL: Forbidden environment file tracked in git: {rel}", file=sys.stderr)
                  sys.exit(1)
              if p.suffix in {".pem", ".key", ".dump"}:
                  print(f"FAIL: Forbidden key/dump file tracked in git: {rel}", file=sys.stderr)
                  sys.exit(1)
              if not p.is_file():
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              for label, pat in secret_patterns:
                  if pat.search(text):
                      print(f"FAIL: Detected {label} pattern in {rel}", file=sys.stderr)
                      sys.exit(1)

          env_example = (root / ".env.example").read_text(encoding="utf-8")
          if "EXAMPLE_DEV_ONLY_" not in env_example:
              print("FAIL: .env.example must use explicit EXAMPLE_DEV_ONLY_ placeholders", file=sys.stderr)
              sys.exit(1)
          print(f"PASS: Secret scan verified {len(tracked)} tracked files in eduerp-v2.")
          PY

  build-lint-typecheck-test:
    name: "JS Workspace Lint, Typecheck, Build, Unit, DB (G1) & Auth/RBAC (G2) Tests"
    runs-on: ubuntu-latest
    needs: verify-contracts-and-secrets
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduerp_pg_superuser
          POSTGRES_PASSWORD: ci_superuser_password_only
          POSTGRES_DB: eduerp_test_ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eduerp_pg_superuser -d eduerp_test_ci_admin"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js from eduerp-v2/.nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: "eduerp-v2/.nvmrc"

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma 7 Client
        run: npm run prisma:generate

      - name: Run ESLint across workspaces
        run: npm run lint

      - name: Run TypeScript strict typecheck across workspaces
        run: npm run typecheck

      - name: Build workspaces and execute unit, contract, and subprocess tests
        run: npm test

      - name: Bootstrap separated PostgreSQL roles and verify Prisma migrate deploy idempotency
        env:
          PGPASSWORD: ci_superuser_password_only
          MIGRATION_DATABASE_URL: postgresql://eduerp_migrator:EXAMPLE_DEV_ONLY_MIGRATOR_PASS@127.0.0.1:5432/eduerp_guliston_ilm_dev?schema=public
        run: |
          psql -h 127.0.0.1 -U eduerp_pg_superuser -d eduerp_test_ci_admin -v ON_ERROR_STOP=1 -c "CREATE DATABASE eduerp_guliston_ilm_dev;"
          psql -h 127.0.0.1 -U eduerp_pg_superuser -d eduerp_guliston_ilm_dev -v ON_ERROR_STOP=1 -f infra/db/01-init-roles-and-databases.sql
          npm run migrate:deploy
          npm run migrate:deploy
          psql -h 127.0.0.1 -U eduerp_pg_superuser -d eduerp_guliston_ilm_dev -v ON_ERROR_STOP=1 -f infra/db/02-apply-runtime-grants.sql

      - name: Gate G1 — Run real PostgreSQL database integration test suite (DB-IT-01..DB-IT-25)
        env:
          EDUERP_ALLOW_DESTRUCTIVE_DB_TESTS: "true"
          TEST_DATABASE_ADMIN_URL: postgresql://eduerp_pg_superuser:ci_superuser_password_only@127.0.0.1:5432/eduerp_test_ci_admin
        run: npm run test:db

      - name: Gate G2 — Run real HTTP + PostgreSQL Auth & RBAC integration test suite (AUTH-IT-01..AUTH-IT-17 & G01..G07)
        env:
          EDUERP_ALLOW_DESTRUCTIVE_DB_TESTS: "true"
          TEST_DATABASE_ADMIN_URL: postgresql://eduerp_pg_superuser:ci_superuser_password_only@127.0.0.1:5432/eduerp_test_ci_admin
        run: npm run test:auth

      - name: Gate G3 — Run real HTTP + PostgreSQL Students, Guardians & Enrollments integration test suite (STU-IT-01..STU-IT-10)
        env:
          EDUERP_ALLOW_DESTRUCTIVE_DB_TESTS: "true"
          TEST_DATABASE_ADMIN_URL: postgresql://eduerp_pg_superuser:ci_superuser_password_only@127.0.0.1:5432/eduerp_test_ci_admin
        run: npm run test:students

  docker-dev-smoke:
    name: "Build and smoke-test the dev Compose stack (migrator + /health + /ready)"
    runs-on: ubuntu-latest
    needs: build-lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the isolated development stack
        run: docker compose --env-file .env.example -f infra/compose.dev.yml up --build --wait --wait-timeout 180 -d
      - name: Verify PostgreSQL roles, API liveness (/api/v1/health), and DB readiness (/api/v1/ready)
        run: |
          docker compose --env-file .env.example -f infra/compose.dev.yml exec -T postgres pg_isready -U eduerp_api_runtime -d eduerp_guliston_ilm_dev
          curl --fail --silent http://127.0.0.1:3000/api/v1/health
          curl --fail --silent http://127.0.0.1:3000/api/v1/ready
          docker compose --env-file .env.example -f infra/compose.dev.yml ps --status running --services | sort > /tmp/eduerp-services
          python3 -c 'assert set(open("/tmp/eduerp-services").read().split()) == {"api", "worker", "postgres"}'
      - name: Diagnose a failed development stack
        if: failure()
        run: docker compose --env-file .env.example -f infra/compose.dev.yml logs --no-color --tail 80
      - name: Stop the ephemeral development stack
        if: always()
        run: docker compose --env-file .env.example -f infra/compose.dev.yml down -v
