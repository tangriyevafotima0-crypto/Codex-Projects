# EduERP v2.0 — Local Development Docker Compose Environment (infra/compose.dev.yml)
# Stage 04 (04.02, 04.05 / T04.02, T04.05):
# - PostgreSQL 16 with healthcheck, persistent volume (eduerp_dev_pgdata), and NO public 0.0.0.0:5432 port exposure.
# - Automatically initializes separated non-superuser roles (eduerp_migrator, eduerp_api_runtime, eduerp_worker_runtime,
#   eduerp_readonly, eduerp_center_b_api), isolated per-center databases (eduerp_guliston_ilm_dev, eduerp_jizzax_ziyo_dev),
#   and the canonical 46-table / 24-trigger migration before API and Worker start.
# - API connects strictly as eduerp_api_runtime (non-superuser) and exposes both /api/v1/health and /api/v1/ready.

name: eduerp-v2-dev

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduerp_guliston_ilm_dev}
      POSTGRES_USER: ${POSTGRES_USER:-eduerp_pg_superuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EXAMPLE_DEV_ONLY_REPLACE_ME_NotARealDbPassword}
      TZ: UTC
    volumes:
      - eduerp_dev_pgdata:/var/lib/postgresql/data
      - ./db/00-docker-init.sh:/docker-entrypoint-initdb.d/00-docker-init.sh:ro
      - ./db:/opt/eduerp/sql:ro
      - ../apps/api/prisma/migrations:/opt/eduerp/migrations:ro
    networks:
      - eduerp_dev_private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduerp_api_runtime -d $${POSTGRES_DB:-eduerp_guliston_ilm_dev}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CENTER_ID: ${CENTER_ID:-11111111-2222-4333-8444-555555555555}
      CENTER_SLUG: ${CENTER_SLUG:-guliston-ilm}
      CENTER_TIMEZONE: ${CENTER_TIMEZONE:-Asia/Tashkent}
      LICENSE_MODE: ${LICENSE_MODE:-ACTIVE}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://eduerp_api_runtime:EXAMPLE_DEV_ONLY_API_RUNTIME_PASS@postgres:5432/eduerp_guliston_ilm_dev?schema=public}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://eduerp_migrator:EXAMPLE_DEV_ONLY_MIGRATOR_PASS@postgres:5432/eduerp_guliston_ilm_dev?schema=public}
      READONLY_DATABASE_URL: ${READONLY_DATABASE_URL:-postgresql://eduerp_readonly:EXAMPLE_DEV_ONLY_READONLY_PASS@postgres:5432/eduerp_guliston_ilm_dev?schema=public}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-EXAMPLE_DEV_ONLY_JWT_ACCESS_SECRET_REPLACE_ME_0001}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-EXAMPLE_DEV_ONLY_JWT_REFRESH_SECRET_REPLACE_ME_0002}
      INTERNAL_BOT_HMAC_SECRET: ${INTERNAL_BOT_HMAC_SECRET:-EXAMPLE_DEV_ONLY_INTERNAL_BOT_HMAC_SECRET_REPLACE_03}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-EXAMPLE_DEV_ONLY_TG_WEBHOOK_SECRET_04}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    networks:
      - eduerp_dev_private_net
      - eduerp_dev_edge_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health && wget -qO- http://127.0.0.1:3000/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_ID: ${WORKER_ID:-worker-guliston-ilm-dev-01}
      CENTER_ID: ${CENTER_ID:-11111111-2222-4333-8444-555555555555}
      CENTER_SLUG: ${CENTER_SLUG:-guliston-ilm}
      CENTER_TIMEZONE: ${CENTER_TIMEZONE:-Asia/Tashkent}
      LICENSE_MODE: ${LICENSE_MODE:-ACTIVE}
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://eduerp_worker_runtime:EXAMPLE_DEV_ONLY_WORKER_RUNTIME_PASS@postgres:5432/eduerp_guliston_ilm_dev?schema=public}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-500}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-5000}
      BOT_OUTBOUND_ENABLED: ${BOT_OUTBOUND_ENABLED:-false}
    networks:
      - eduerp_dev_private_net

networks:
  eduerp_dev_private_net:
    driver: bridge
    internal: true
  eduerp_dev_edge_net:
    driver: bridge

volumes:
  eduerp_dev_pgdata:
    name: eduerp_dev_pgdata
