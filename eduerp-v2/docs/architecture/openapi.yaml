{
  "openapi": "3.1.0",
  "info": {
    "title": "EduERP v2.0 — Center Staff API, Internal Bot Command API & Vendor Control Plane Contract",
    "version": "2.0.0-draft.s02",
    "description": "Strict JSON-formatted OpenAPI 3.1.0 specification (valid YAML 1.2 superset, parsable offline via Python stdlib json). NOTE: Offline JSON parse and local $ref/operationId/security verification do NOT replace a full external OpenAPI 3.1 schema validator runtime (marked NOT_RUN where applicable). Enforces: (1) 100% Staff-Only Web/Mobile login (no Parent/Student web/app login before v3.0); (2) Strict Center A vs Center B isolation and separate Vendor Control Plane trust boundary (zero student PII in Vendor responses); (3) TeacherStudentView omits guardian/student phone numbers and financial fields (F04, T02.03, T05.04); (4) Integer UZS scale=0 money contract (amount_uzs string pattern ^-?[0-9]+$, 1 integer = 1 UZS so'm, C03); (5) Every write operation requires Idempotency-Key and/or expected_version (same key + different body -> 409)."
  },
  "servers": [
    {
      "url": "https://{center_slug}.eduerp.uz",
      "description": "Isolated Per-Center Data Plane API (Staff Web, Flutter Mobile, Locked Excel, Bot Command API)",
      "variables": {
        "center_slug": {
          "default": "guliston-ilm",
          "description": "Unique center slug bound to isolated Docker Compose stack and PostgreSQL DB"
        }
      }
    },
    {
      "url": "https://vendor.eduerp.uz",
      "description": "Isolated Vendor Control Plane API (Vendor MFA Auth, Center Registry & Subscription Kill-Switch — Zero Student PII)"
    }
  ],
  "tags": [
    {
      "name": "SystemHealth",
      "description": "Healthcheck and license state inspection"
    },
    {
      "name": "StaffAuthAndUsers",
      "description": "Staff-only authentication, session management, and staff accounts"
    },
    {
      "name": "StudentsAndGuardians",
      "description": "15s student registration, M:N guardians, sibling-safe duplicate check, and enrollment lifecycle"
    },
    {
      "name": "GroupsLessonsSubstitutes",
      "description": "Courses, groups, multi-lesson daily occurrences, 1-day substitute teacher, and exam grades"
    },
    {
      "name": "AttendanceAndOfflineSync",
      "description": "30s attendance submit, offline SQLite batch sync, and Admin reason-based override"
    },
    {
      "name": "BillingAndInvoices",
      "description": "Billing policy versions, Calendar/Rolling/12-Lesson cycles, pro-rata, and trial activation/compensation"
    },
    {
      "name": "DiscountsAndFreezes",
      "description": "Family/50%/Grant discount requests, Director approvals, and net-earned Freeze credits"
    },
    {
      "name": "PaymentsReceiptsRefunds",
      "description": "Atomic partial payment + promise-to-pay, allocations, unapplied credit, internal receipts, and append-only reversals/refunds"
    },
    {
      "name": "CashShiftsAndExpenses",
      "description": "Daily cash shift open/close reconciliation and cash/non-cash expenses"
    },
    {
      "name": "ExcelTemplatesAndImport",
      "description": "Locked XLSX export with hidden student_id, red/green Dry-Run validator, and atomic commit"
    },
    {
      "name": "ReportsPayrollChurn",
      "description": "Director cash/accrual revenue, debt forecast, teacher/substitute payroll snapshots, and 5-reason churn analytics"
    },
    {
      "name": "TelegramBotAndCallbacks",
      "description": "Telegram webhook, single-use guardian phone verification, balance/attendance query, and Director approval callbacks (D06)"
    },
    {
      "name": "VendorControlPlane",
      "description": "Separate Vendor MFA auth, PII-free center registry, and signed Read-Only Kill-Switch license management"
    }
  ],
  "components": {
    "securitySchemes": {
      "StaffBearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Center-scoped Staff JWT (claims: staff_id, center_id, role in DIRECTOR|ADMIN|TEACHER, session_id). Never issued to Parents/Students."
      },
      "BotInternalAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Internal-Bot-Signature",
        "description": "Authenticated HMAC-SHA256 command channel from Center Bot container to Center Backend API (D06)."
      },
      "TelegramWebhookSecret": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Telegram-Bot-Api-Secret-Token",
        "description": "Per-center Telegram webhook secret token verified on every incoming Telegram Update (B15, T14.04)."
      },
      "VendorMfaBearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Isolated Vendor Control Plane JWT requiring verified TOTP MFA claim (mfa_verified=true, D23, T19.01)."
      }
    },
    "parameters": {
      "RequestIdHeader": {
        "name": "X-Request-Id",
        "in": "header",
        "required": false,
        "description": "Correlation request UUID echoed in responses and audit logs (T03.02).",
        "schema": {
          "$ref": "#/components/schemas/Uuid"
        }
      },
      "IdempotencyKeyHeader": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Client operation idempotency key (UUID or 16..128 chars). Scoped to (center_id, actor_id, key). Same key + different body returns 409 IDEMPOTENCY_PAYLOAD_MISMATCH.",
        "schema": {
          "type": "string",
          "minLength": 8,
          "maxLength": 128
        }
      },
      "IfMatchVersionHeader": {
        "name": "If-Match-Version",
        "in": "header",
        "required": false,
        "description": "Optional header mirror of expected_version for optimistic concurrency control (mismatch returns 409 VERSION_CONFLICT).",
        "schema": {
          "type": "integer",
          "minimum": 1
        }
      },
      "CursorParam": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "description": "Opaque pagination cursor.",
        "schema": {
          "type": "string"
        }
      },
      "LimitParam": {
        "name": "limit",
        "in": "query",
        "required": false,
        "description": "Page size (default 50, max 200).",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 200,
          "default": 50
        }
      }
    },
    "responses": {
      "BadRequest400": {
        "description": "400 Bad Request — malformed JSON, invalid parameter syntax, or schema violation.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "Unauthorized401": {
        "description": "401 Unauthorized — missing, expired, or revoked session/JWT or invalid webhook secret.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "Forbidden403": {
        "description": "403 Forbidden — insufficient role (RBAC), cross-group/cross-center IDOR attempt, or center in LICENSE_READ_ONLY_MODE.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "NotFound404": {
        "description": "404 Not Found — target resource does not exist in this center scope.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "Conflict409": {
        "description": "409 Conflict — optimistic expected_version mismatch, stale Excel row, closed cash shift, duplicate student, or same Idempotency-Key with different request body.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "Unprocessable422": {
        "description": "422 Unprocessable Entity — domain invariant violation (e.g., partial payment without promise_date, zero planned lessons, refund cap exceeded, missing churn reason, or unconfirmed policy gate).",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      },
      "RateLimited429": {
        "description": "429 Too Many Requests — login bruteforce limit or API/Telegram rate limit exceeded (includes retry_after_seconds).",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        }
      }
    },
    "schemas": {
      "Uuid": {
        "type": "string",
        "format": "uuid",
        "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      },
      "MoneyUzs": {
        "type": "string",
        "pattern": "^-?[0-9]+$",
        "description": "Unambiguous integer UZS amount string at scale=0 (1 integer = 1 UZS so'm, e.g., '280000' = 280,000 so'm). Float and tiyin mixing are strictly forbidden (C03)."
      },
      "CurrencyCode": {
        "type": "string",
        "enum": [
          "UZS"
        ],
        "default": "UZS"
      },
      "IsoDate": {
        "type": "string",
        "format": "date",
        "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
        "description": "Business calendar date in center local timezone (Asia/Tashkent)."
      },
      "UtcTimestamp": {
        "type": "string",
        "format": "date-time",
        "description": "UTC timestamp in ISO-8601 format (e.g., 2026-11-12T04:00:00Z)."
      },
      "StaffRole": {
        "type": "string",
        "enum": [
          "DIRECTOR",
          "ADMIN",
          "TEACHER"
        ]
      },
      "PaymentMethod": {
        "type": "string",
        "enum": [
          "CASH",
          "CARD",
          "CLICK",
          "PAYME",
          "TRANSFER"
        ]
      },
      "BillingMode": {
        "type": "string",
        "enum": [
          "CALENDAR_PRO_RATA",
          "ROLLING_MONTH",
          "LESSON_PACKAGE_12"
        ]
      },
      "EnrollmentStatus": {
        "type": "string",
        "enum": [
          "TRIAL",
          "ACTIVE",
          "FROZEN",
          "LEFT"
        ]
      },
      "AttendanceStatus": {
        "type": "string",
        "enum": [
          "PRESENT",
          "LATE",
          "ABSENT"
        ]
      },
      "ChurnReasonCode": {
        "type": "integer",
        "enum": [
          1,
          2,
          3,
          4,
          5
        ],
        "description": "1=Financial difficulty, 2=Disliked teacher, 3=Schedule mismatch, 4=Moved to competitor, 5=Completed course or relocated (PDF p.5)."
      },
      "LicenseMode": {
        "type": "string",
        "enum": [
          "ACTIVE",
          "GRACE_PERIOD",
          "READ_ONLY"
        ]
      },
      "ErrorEnvelope": {
        "type": "object",
        "required": [
          "error_code",
          "message",
          "request_id",
          "timestamp_utc"
        ],
        "properties": {
          "error_code": {
            "type": "string",
            "enum": [
              "VALIDATION_ERROR",
              "UNAUTHORIZED",
              "FORBIDDEN_ROLE",
              "FORBIDDEN_OBJECT_SCOPE",
              "LICENSE_READ_ONLY_MODE",
              "NOT_FOUND",
              "VERSION_CONFLICT",
              "STALE_EXCEL_CONFLICT",
              "IDEMPOTENCY_PAYLOAD_MISMATCH",
              "DUPLICATE_STUDENT_DETECTED",
              "SHIFT_CLOSED",
              "PROMISE_DATE_REQUIRED_FOR_PARTIAL_PAYMENT",
              "INVALID_SCHEDULE_ZERO_LESSONS",
              "REFUND_CAP_EXCEEDED",
              "FREEZE_CREDIT_CAP_EXCEEDED",
              "LAST_DIRECTOR_CANNOT_BE_DEACTIVATED",
              "POLICY_DECISION_NOT_CONFIRMED",
              "RATE_LIMITED"
            ]
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "timestamp_utc": {
            "$ref": "#/components/schemas/UtcTimestamp"
          },
          "retry_after_seconds": {
            "type": "integer",
            "nullable": true
          },
          "conflict_details": {
            "type": "object",
            "nullable": true
          }
        }
      },
      "HealthResponse": {
        "type": "object",
        "required": [
          "status",
          "center_slug",
          "license_mode",
          "request_id",
          "timestamp_utc"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "OK",
              "DEGRADED"
            ]
          },
          "center_slug": {
            "type": "string"
          },
          "license_mode": {
            "$ref": "#/components/schemas/LicenseMode"
          },
          "request_id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "timestamp_utc": {
            "$ref": "#/components/schemas/UtcTimestamp"
          }
        }
      },
      "StaffLoginRequest": {
        "type": "object",
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "password": {
            "type": "string",
            "minLength": 8,
            "maxLength": 128
          },
          "device_info": {
            "type": "string",
            "maxLength": 255
          }
        }
      },
      "StaffAuthResponse": {
        "type": "object",
        "required": [
          "access_token",
          "refresh_token",
          "staff_id",
          "role",
          "must_change_password",
          "license_mode"
        ],
        "properties": {
          "access_token": {
            "type": "string"
          },
          "refresh_token": {
            "type": "string"
          },
          "staff_id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "role": {
            "$ref": "#/components/schemas/StaffRole"
          },
          "must_change_password": {
            "type": "boolean"
          },
          "license_mode": {
            "$ref": "#/components/schemas/LicenseMode"
          }
        }
      },
      "ChangePasswordRequest": {
        "type": "object",
        "required": [
          "current_password",
          "new_password",
          "expected_version"
        ],
        "properties": {
          "current_password": {
            "type": "string"
          },
          "new_password": {
            "type": "string",
            "minLength": 8,
            "maxLength": 128
          },
          "expected_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "CreateStaffRequest": {
        "type": "object",
        "required": [
          "full_name",
          "login_username",
          "role",
          "initial_password"
        ],
        "properties": {
          "full_name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 120
          },
          "login_username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 64
          },
          "role": {
            "$ref": "#/components/schemas/StaffRole"
          },
          "phone_e164": {
            "type": "string",
            "pattern": "^\\+[1-9][0-9]{7,14}$"
          },
          "initial_password": {
            "type": "string",
            "minLength": 8,
            "maxLength": 128
          }
        }
      },
      "UpdateStaffStatusRequest": {
        "type": "object",
        "required": [
          "status",
          "role",
          "reason",
          "expected_version"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "DEACTIVATED"
            ]
          },
          "role": {
            "$ref": "#/components/schemas/StaffRole"
          },
          "reason": {
            "type": "string",
            "minLength": 3
          },
          "expected_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "StaffUserResponse": {
        "type": "object",
        "required": [
          "id",
          "full_name",
          "login_username",
          "role",
          "status",
          "version"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "full_name": {
            "type": "string"
          },
          "login_username": {
            "type": "string"
          },
          "role": {
            "$ref": "#/components/schemas/StaffRole"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "DEACTIVATED"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "StaffUserListResponse": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/StaffUserResponse"
            }
          },
          "next_cursor": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "QuickRegisterStudentRequest": {
        "type": "object",
        "required": [
          "student_full_name",
          "guardian_full_name",
          "guardian_phone_e164",
          "group_id",
          "initial_status",
          "enrolled_at_date"
        ],
        "properties": {
          "student_full_name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 120
          },
          "birth_date": {
            "$ref": "#/components/schemas/IsoDate"
          },
          "guardian_full_name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 120
          },
          "guardian_phone_e164": {
            "type": "string",
            "pattern": "^\\+[1-9][0-9]{7,14}$"
          },
          "relationship": {
            "type": "string",
            "enum": [
              "MOTHER",
              "FATHER",
              "GUARDIAN",
              "SELF"
            ],
            "default": "GUARDIAN"
          },
          "group_id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "initial_status": {
            "type": "string",
            "enum": [
              "TRIAL",
              "ACTIVE"
            ]
          },
          "enrolled_at_date": {
            "$ref": "#/components/schemas/IsoDate"
          },
          "confirm_sibling_or_similar_name": {
            "type": "boolean",
            "default": false
          }
        }
      },
      "AdminStudentView": {
        "type": "object",
        "required": [
          "student_id",
          "student_code",
          "full_name",
          "status",
          "guardians",
          "enrollments",
          "total_remaining_debt_uzs",
          "unapplied_credit_uzs",
          "bot_delivery_warning",
          "version"
        ],
        "properties": {
          "student_id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "student_code": {
            "type": "string"
          },
          "full_name": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "ARCHIVED"
            ]
          },
          "guardians": {
            "type": "array",
            "items": {
              "type": "object",
              "required": [
                "guardian_id",
                "full_name",
                "phone_e164",
                "telegram_link_status"
              ],
              "properties": {
                "guardian_id": {
                  "$ref": "#/components/schemas/Uuid"
                },
                "full_name": {
                  "type": "string"
                },
                "phone_e164": {
                  "type": "string"
                },
                "telegram_link_status": {
                  "type": "string",
                  "enum": [
                    "INVITED",
                    "ACTIVE",
                    "BOT_BLOCKED_403",
                    "UNLINKED_REVOKED"
                  ]
                }
              }
            }
          },
          "enrollments": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EnrollmentResponse"
            }
          },
          "family_discount_eligible": {
            "type": "boolean"
          },
          "total_remaining_debt_uzs": {
            "$ref": "#/components/schemas/MoneyUzs"
          },
          "unapplied_credit_uzs": {
            "$ref": "#/components/schemas/MoneyUzs"
          },
          "bot_delivery_warning": {
            "type": "boolean",
            "description": "Yellow badge when guardian bot is unlinked or blocked (2-Loop, R18)."
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "AdminStudentListResponse": {
        "type": "object",
        "required": [
          "items",
          "next_cursor"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AdminStudentView"
            }
          },
          "next_cursor": {
            "type": "string",
            "nullable": true
          }
        }
      },
      "TeacherStudentView": {
        "type": "object",
        "description": "Strict Teacher DTO projection (F04, C05, T02.03, T05.04): Contains ZERO guardian/student phone fields and ZERO financial/debt/payment fields.",
        "required": [
          "student_id",
          "enrollment_id",
          "student_code",
          "full_name",
          "enrollment_status"
        ],
        "additionalProperties": false,
        "properties": {
          "student_id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "enrollment_id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "student_code": {
            "type": "string"
          },
          "full_name": {
            "type": "string"
          },
          "enrollment_status": {
            "type": "string",
            "enum": [
              "TRIAL",
              "ACTIVE"
            ]
          }
        }
      },
      "UpdateGuardianPhoneRequest": {
        "type": "object",
        "required": [
          "new_phone_e164",
          "reason",
          "revoke_existing_telegram_links",
          "expected_version"
        ],
        "properties": {
          "new_phone_e164": {
            "type": "string",
            "pattern": "^\\+[1-9][0-9]{7,14}$"
          },
          "reason": {
            "type": "string",
            "minLength": 3
          },
          "revoke_existing_telegram_links": {
            "type": "boolean",
            "enum": [
              true
            ],
            "description": "Must revoke old Telegram chat access on phone change (D18, T06.02, T14.01)."
          },
          "expected_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "GuardianInviteResponse": {
        "type": "object",
        "required": [
          "guardian_id",
          "single_use_invite_deeplink",
          "expires_at_utc",
          "revoked_old_links_count"
        ],
        "properties": {
          "guardian_id": {
            "$ref": "#/components/schemas/Uuid"
          },
          "single_use_invite_deeplink": {
            "type": "string"
          },
          "expires_at_utc": {
            "$ref": "#/components/schemas/UtcTimestamp"
          },
          "revoked_old_links_count": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "WithdrawEnrollmentRequest": {
        "type": "object",
        "required": [
          "left_at_date",
          "churn_reason_code",
          "expected_version"
        ],
        "properties": {
          "left_at_date": {
            "$ref": "#/components/schemas/IsoDate"
          },
          "churn_reason_code": {
            "$ref": "#/components/schemas/ChurnReasonCode"
          },
          "churn_notes": {
            "type": "string",
            "maxLength": 500
          },
          "expected_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "EnrollmentResponse": {
        "type": "object",
        "required": [
          "enrollment_id",
