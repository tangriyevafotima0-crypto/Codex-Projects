      "PositiveMoneyUzs": {
        "type": "string",
        "pattern": "^[1-9][0-9]{0,17}$",
        "maxLength": 18,
        "description": "Strictly positive integer UZS amount (> 0) at scale=0 (1 integer = 1 UZS so'm, ENGINEERING_PROPOSAL C03, S2F07). Bounded to 1..18 digits within signed 64-bit PostgreSQL BIGINT. Rejects '0', negative numbers, leading zeros, and decimals."
      },
      "NonNegativeMoneyUzs": {
        "type": "string",
        "pattern": "^(0|[1-9][0-9]{0,17})$",
        "maxLength": 18,
        "description": "Non-negative integer UZS amount (>= 0) at scale=0 (1 integer = 1 UZS so'm, ENGINEERING_PROPOSAL C03, S2F07). Bounded to 1..18 digits within signed 64-bit PostgreSQL BIGINT. Rejects negative numbers, leading zeros like '00', and decimals."
      },
      "SignedMoneyDeltaUzs": {
        "type": "string",
        "pattern": "^(0|-?[1-9][0-9]{0,17})$",
        "maxLength": 19,
        "description": "Signed integer UZS delta (-, 0, +) at scale=0 (ENGINEERING_PROPOSAL C03, S2F07), bounded to 18 digits within signed 64-bit PostgreSQL BIGINT. Used only for cash shift discrepancy_uzs and aggregate adjustment totals."
      },
      "NonZeroSignedMoneyDeltaUzs": {
        "type": "string",
        "pattern": "^-?[1-9][0-9]{0,17}$",
        "maxLength": 19,
        "description": "Non-zero signed integer UZS delta (!= 0) at scale=0 (ENGINEERING_PROPOSAL C03, S2F07), bounded to 18 digits within signed 64-bit PostgreSQL BIGINT. Used for PayrollAdjustment.delta_amount_uzs and CashExpense.amount_uzs."
      },
